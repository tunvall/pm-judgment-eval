id: incident-rollback
version: 3
set: dev

title: Two-hour decision on a live production incident

source:
  type: historical
  sanitized: true

dimensions:
  - execution
  - tradeoff

difficulty: medium

scenario: |
  You are a product manager covering as incident lead while your manager is
  unavailable. A launch extending risk-signal coverage to a newly supported
  third-party integration went out as planned earlier today. Within two hours,
  existing customers on unrelated, already-supported transaction types started
  seeing incorrect risk signals fire, and a high-severity incident has been
  declared.

  Engineering has identified the root cause: a scoping bug where the new
  integration's inclusion logic inadvertently affected signal calibration for
  transactions that have nothing to do with the new integration. A proper,
  well-tested fix would take several days to build. Every additional hour the
  issue continues means more customers receiving mistaken alerts and more support
  burden. The new integration launch was publicly announced, and rolling it back
  means undoing a commitment customers were already told about.

question: |
  What do you do, and why?

constraints:
  - You are the acting incident lead; your manager is unavailable.
  - A high-severity incident has already been declared, confirming production
    impact.
  - The new integration launch was publicly announced.

rubric:
  criteria:
    - id: commits_to_a_specific_action_quickly
      description: >
        Makes a clear, specific call rather than describing options without
        deciding, appropriate given the active-incident time pressure.
      weight: 2

    - id: distinguishes_reversible_from_expensive_to_reverse
      description: >
        Explicitly reasons about the reversibility of whichever option it
        recommends (full rollback, a fast fix, a mitigation that avoids both,
        or something else) versus the alternatives it didn't pick. Full credit
        requires naming the actual reversibility tradeoff of the chosen path,
        not asserting that a decision was made without addressing how easily
        it could be undone if wrong. A response that names reversibility as a
        relevant factor for its own chosen option, without a fully symmetric
        comparison against every alternative, should score partially_met, not
        not_met: recognizing reversibility as a relevant factor at all is most
        of the reasoning skill this criterion targets, even without a fully
        symmetric comparison.
      weight: 3

    - id: weighs_ongoing_harm_against_launch_momentum
      description: >
        Explicitly weighs the cost of continued incorrect signals accruing every
        additional hour against the cost of walking back a publicly announced
        launch commitment.
      weight: 3

    - id: avoids_betting_on_unvalidated_fast_fix
      description: >
        Does not default to pushing a fast fix forward without acknowledging
        that doing so is optimistic and unvalidated, given that a proper fix is
        already described as taking several days.
      weight: 2

    - id: proposes_concrete_next_step
      description: >
        Includes what happens after the immediate decision (e.g., communicating
        with affected customers, a path back to relaunch), not only the
        immediate stop-the-bleeding action.
      weight: 2

analysis_only:
  historical_decision: |
    Chose full rollback of the new integration's coverage within two hours of
    the incident being declared, followed by a transparent post-incident writeup
    to affected accounts.

  eventual_outcome: |
    The feature relaunched successfully a few weeks later after properly
    isolating the new integration's logic from unrelated signal calibration,
    with no recurrence. Customer trust was preserved.

  case_author_notes: |
    A time-pressured, relatively clean-cut case once reasoned through, included
    to test decisiveness and reversible-vs-expensive-to-reverse thinking under
    real incident pressure, distinct from the slower-moving strategic cases in
    the dev set.

    v2: bumped after the first cross-judge pass (Claude, GPT, Gemini all
    scoring the same 3 responses) produced a real three-way scatter on
    distinguishes_reversible_from_expensive_to_reverse (10.5, 10.5, 9.0) for
    the identical response, all three judges agreed on what was missing from
    the response but disagreed on whether that gap warranted partially_met or
    not_met. Human review (Fredrik) resolved the ambiguity: one-sided
    reasoning about reversibility should earn partial credit. Criterion
    description tightened to say so explicitly rather than leaving it to each
    judge's own threshold. v1 scores remain valid records of what happened
    under the old wording; they are not retroactively wrong, the wording was
    underspecified.

    Reclassified dev (2026-09-10, was heldout): the v2 revision above was
    made after viewing real candidate/judge output, which by definition
    disqualifies this case from held-out status per docs/methodology.md
    ("never viewed against any model's real output before being finalized").
    Caught via external methodology review (ChatGPT + Gemini, cross-checked
    against this file). A fresh, untouched case should replace this one in
    the held-out set rather than counting this case toward it.

    v3 (2026-09-10): distinguishes_reversible_from_expensive_to_reverse
    reworded after the same external review flagged it as implicitly
    requiring the historical rollback conclusion for full credit. Broadened
    to reward reasoning about the reversibility of whatever option the
    response actually recommends, so a genuinely reversible alternative (e.g.
    muting affected signals without a full rollback) can score on its own
    merits rather than only being measured against the rollback/fast-fix
    framing. v1/v2 scores remain valid records under the prior wording.
